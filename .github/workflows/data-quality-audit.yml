name: Data quality audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "clean_data.csv"
      - "scripts/data_quality_audit.py"
      - "scripts/extended_data_audit.py"
      - ".github/workflows/data-quality-audit.yml"
  push:
    branches: [main]
    paths:
      - "clean_data.csv"
      - "scripts/data_quality_audit.py"
      - ".github/workflows/data-quality-audit.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate aggregate data-quality report
        run: |
          python scripts/data_quality_audit.py
          python scripts/extended_data_audit.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: reports/data_quality.*
